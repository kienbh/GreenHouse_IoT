; Bài 9: node CHỈ ĐO thử ngủ sâu (deep sleep). Không điều khiển tải nào, không thay firmware nhà kính.
; Dùng chung WiFi (../firmware/src/secrets.h) và CA (../firmware/src/ca_cert.h) với firmware chính.
[env:sleepnode]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
build_flags = -I ../firmware/src
lib_deps = knolleary/PubSubClient@^2.8
