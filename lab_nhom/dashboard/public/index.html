<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp IoT · Các nhóm</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --fg:#17202e; --mut:#667085; --line:#e3e7ee; --acc:#2563eb;
          --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --temp:#ef4444; --hum:#2f80ed; --track:#eceff4 }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1218; --card:#161b23; --fg:#e7ebf2; --mut:#98a2b3; --line:#262d39; --acc:#5b9bff; --track:#232a35 }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding:16px 20px; border-bottom:1px solid var(--line); background:var(--card) }
  h1 { margin:0; font-size:20px }
  .broker { display:flex; align-items:center; gap:10px; padding:6px 12px; border:1px solid var(--line); border-radius:10px }
  .broker b { font-size:20px; font-variant-numeric:tabular-nums; letter-spacing:.01em }
  .broker small { color:var(--mut); display:block; font-size:11.5px; line-height:1.2 }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--mut); display:inline-block; flex:none }
  .dot.ok { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent) }
  .dot.bad { background:var(--bad) } .dot.warn { background:var(--warn) }
  .stats { display:flex; gap:18px; margin-left:auto; flex-wrap:wrap }
  .stat small { display:block; color:var(--mut); font-size:11.5px } .stat b { font-size:18px; font-variant-numeric:tabular-nums }
  a.btn, button.btn { font:inherit; font-size:13px; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; text-decoration:none }
  a.btn:hover, button.btn:hover { border-color:var(--acc) }
  /* Điểm danh: 1 ô mỗi nhóm, màu theo trạng thái */
  #roster { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:3 }
  #roster .sum { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px; margin-bottom:10px; font-size:14px }
  #roster .sum b.big { font-size:22px; font-variant-numeric:tabular-nums }
  #roster .sum .miss { color:var(--bad) } #roster .sum .miss b { color:var(--fg) }
  #chips { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px }
  .chip { border:2px solid var(--line); border-radius:10px; padding:6px 8px; cursor:pointer; text-align:center; background:var(--bg); line-height:1.2 }
  .chip b { display:block; font-size:20px; font-variant-numeric:tabular-nums }
  .chip small { font-size:11.5px; color:var(--mut) }
  .chip.ok { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--card)) } .chip.ok small { color:var(--ok); font-weight:600 }
  .chip.warn { border-color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, var(--card)) } .chip.warn small { color:var(--warn); font-weight:600 }
  .chip.bad { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 10%, var(--card)) } .chip.bad small { color:var(--bad); font-weight:600 }
  .chip.none { border-style:dashed; opacity:.75 }
  .legend2 { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--mut); margin-left:auto }
  .legend2 i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px }
  .card.hl { outline:3px solid var(--acc); outline-offset:2px }
  main { padding:18px 20px 120px }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px }
  .empty { grid-column:1/-1; text-align:center; color:var(--mut); padding:60px 10px; border:1px dashed var(--line); border-radius:14px }

  /* Thẻ nhóm */
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px 10px; position:relative; transition:border-color .4s, opacity .3s }
  .card.ping { border-color:var(--acc); transition:none }
  .card.off { opacity:.55 }
  .top { display:flex; align-items:center; gap:8px }
  .top h2 { margin:0; font-size:17px } .top .st { font-size:12.5px; color:var(--mut) } .top .ago { margin-left:auto; font-size:12px; color:var(--mut); font-variant-numeric:tabular-nums }
  .sensors { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; margin:10px 0 6px }
  .thermo { display:flex; align-items:center; gap:6px }
  .thermo .val { font-size:28px; font-weight:650; font-variant-numeric:tabular-nums; line-height:1 } .unit { font-size:14px; color:var(--mut); font-weight:500 }
  .lbl { font-size:11.5px; color:var(--mut); display:block }
  .ring { position:relative; width:84px; height:84px; justify-self:end }
  .ring .rv { position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-size:19px; font-weight:650; font-variant-numeric:tabular-nums; line-height:1.05 }
  .ring .rv small { display:block; font-size:10.5px; color:var(--mut); font-weight:500 }
  .io { display:flex; gap:10px; margin:6px 0 4px }
  .io > div { flex:1; display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:10px; padding:6px 10px }
  .io .led { cursor:pointer } .io .led:hover { border-color:var(--acc) }
  .ctl { display:flex; align-items:center; gap:6px; margin:6px 0 2px; flex-wrap:wrap }
  .ctl button { font:inherit; font-size:12.5px; padding:4px 10px; border-radius:7px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer }
  .ctl button:hover { border-color:var(--acc) } .ctl button:disabled { opacity:.4; cursor:default }
  .ctl .fb { font-size:12px; color:var(--mut) } .ctl .fb.ok { color:var(--ok) } .ctl .fb.bad { color:var(--bad) }
  .io b { display:block; font-size:14px } .io small { color:var(--mut); font-size:11.5px }
  .bulb { width:30px; height:36px; flex:none; transition:filter .2s }
  .bulb .glass { fill:var(--track); stroke:var(--mut); stroke-width:1.2; transition:fill .2s }
  .led.on .bulb { filter:drop-shadow(0 0 7px #ffcc33) drop-shadow(0 0 2px #ffcc33) }
  .led.on .bulb .glass { fill:#ffd23f; stroke:#d4a106 }
  .sw { width:34px; height:34px; flex:none }
  .sw .base { fill:var(--track); stroke:var(--mut); stroke-width:1.2 }
  .sw .cap { fill:#9aa3b2; transition:transform .08s, fill .08s; transform-origin:17px 17px }
  .btnbox.on .sw .cap { fill:var(--acc); transform:scale(.82) }
  .btnbox.flash { animation:flash .6s }
  @keyframes flash { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--acc) 60%, transparent) } 100% { box-shadow:0 0 0 12px transparent } }
  canvas.spark { width:100%; height:46px; display:block; margin-top:4px }
  .legend { display:flex; gap:12px; font-size:11px; color:var(--mut) } .legend i { display:inline-block; width:10px; height:2px; vertical-align:middle; margin-right:4px }
  .meta { display:flex; gap:10px; font-size:11px; color:var(--mut); margin-top:2px } .meta a { color:var(--mut) }
  .warn { color:var(--warn); font-size:12px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

  /* Nhật ký MQTT */
  #logbox { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); max-height:42vh; display:flex; flex-direction:column }
  #logbox .bar { display:flex; align-items:center; gap:10px; padding:8px 20px }
  #logbox .bar b { font-size:13px } #logbox .bar input[type=search] { font:inherit; font-size:13px; padding:4px 8px; border:1px solid var(--line); border-radius:7px; background:transparent; color:var(--fg); width:200px }
  #logbox .bar label { font-size:12.5px; color:var(--mut) } #logbox .bar .btn { margin-left:auto }
  #log { overflow:auto; font:12px/1.5 ui-monospace,Menlo,monospace; padding:0 20px 10px; display:none }
  #logbox.open #log { display:block }
  #log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis } #log .w { color:var(--warn) } #log .s { color:var(--mut) }
  #log time { color:var(--mut); margin-right:8px }
  @media (max-width:600px) { #roster { position:static; padding:12px 14px } header { padding:12px 14px } main { padding:14px 14px 120px } .stats { margin-left:0 } #grid { grid-template-columns:1fr } }
</style>
</head>
<body>
<header>
  <h1>Lớp IoT · Các nhóm</h1>
  <div class="broker" title="SV nhập địa chỉ này vào ESP32 (mqtt_server)">
    <span class="dot" id="bdot"></span>
    <div><small>MQTT broker</small><b id="baddr">--</b></div>
  </div>
  <a class="btn" href="/huong-dan.html" target="_blank">Hướng dẫn SV</a>
  <div class="stats">
    <div class="stat"><small>Đang online</small><b id="sOn">0/0</b></div>
    <div class="stat"><small>Nhiệt độ TB</small><b id="sT">--</b></div>
    <div class="stat"><small>Độ ẩm TB</small><b id="sH">--</b></div>
    <div class="stat"><small>Tin nhắn / phút</small><b id="sRate">0</b></div>
  </div>
</header>
<section id="roster">
  <div class="sum">
    <span>Đã lên <b class="big" id="rOn">0</b> / <b id="rTot">0</b> nhóm</span>
    <span class="miss" id="rMiss"></span>
    <span class="legend2"><span><i style="background:var(--ok)"></i>đang gửi dữ liệu</span><span><i style="background:var(--warn)"></i>im lặng &gt; 30 s</span>
      <span><i style="background:var(--bad)"></i>rớt mạng (offline)</span><span><i style="border:1px dashed var(--mut)"></i>chưa lên</span></span>
  </div>
  <div id="chips"></div>
</section>
<main><div id="grid"><div class="empty" id="empty">Chưa có nhóm nào gửi dữ liệu.<br>Chiếu trang <a href="/huong-dan.html" target="_blank">Hướng dẫn SV</a> để các nhóm cấu hình ESP32.</div></div></main>

<section id="logbox">
  <div class="bar">
    <b>Nhật ký MQTT</b>
    <input type="search" id="filter" placeholder="lọc theo nhóm / topic">
    <label><input type="checkbox" id="onlyWarn"> chỉ tin sai</label>
    <button class="btn" id="logToggle">Mở</button>
  </div>
  <div id="log"></div>
</section>

<template id="tpl">
  <div class="card">
    <div class="top"><span class="dot"></span><h2></h2><span class="st"></span><span class="ago"></span></div>
    <div class="sensors">
      <div class="thermo">
        <svg width="22" height="74" viewBox="0 0 22 74" aria-hidden="true">
          <rect x="7" y="2" width="8" height="56" rx="4" fill="var(--track)" stroke="var(--mut)" stroke-width="1"/>
          <rect class="tfill" x="9" y="56" width="4" height="0" rx="2" fill="var(--temp)"/>
          <circle cx="11" cy="64" r="8" fill="var(--temp)" stroke="var(--mut)" stroke-width="1"/>
        </svg>
        <div><span class="lbl">Nhiệt độ</span><span style="white-space:nowrap"><span class="val t">--</span><span class="unit"> °C</span></span></div>
      </div>
      <div class="ring">
        <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
          <circle cx="42" cy="42" r="34" fill="none" stroke="var(--track)" stroke-width="8"/>
          <circle class="hfill" cx="42" cy="42" r="34" fill="none" stroke="var(--hum)" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="0 214" transform="rotate(-90 42 42)" style="transition:stroke-dasharray .4s"/>
        </svg>
        <div class="rv"><div><span class="h">--</span>%<small>độ ẩm</small></div></div>
      </div>
    </div>
    <div class="io">
      <div class="led" title="Bấm để gửi on / off xuống topic vju/iot/&lt;nhóm&gt;/output">
        <svg class="bulb" viewBox="0 0 30 36" aria-hidden="true">
          <path class="glass" d="M15 2a11 11 0 0 0-6.5 19.9c1.3 1 2 2.3 2 3.6V27h9v-1.5c0-1.3.7-2.6 2-3.6A11 11 0 0 0 15 2z"/>
          <rect x="10.5" y="28.5" width="9" height="2.6" rx="1" fill="var(--mut)"/><rect x="11.5" y="32" width="7" height="2.4" rx="1.2" fill="var(--mut)"/>
        </svg>
        <div><b class="ledv">--</b><small>LED · bấm để đổi</small></div>
      </div>
      <div class="btnbox">
        <svg class="sw" viewBox="0 0 34 34" aria-hidden="true">
          <rect class="base" x="2" y="2" width="30" height="30" rx="6"/><circle class="cap" cx="17" cy="17" r="10"/>
        </svg>
        <div><b class="btnv">--</b><small class="btnc">nút nhấn</small></div>
      </div>
    </div>
    <div class="ctl"><span class="lbl" style="display:inline">Điều khiển:</span><button data-v="1">Bật LED</button><button data-v="0">Tắt LED</button><span class="fb"></span></div>
    <canvas class="spark"></canvas>
    <div class="meta"><span class="legend"><span><i style="background:var(--temp)"></i>°C</span><span><i style="background:var(--hum)"></i>%</span></span>
      <span class="extra"></span><a class="csv" href="#" download>CSV</a></div>
    <div class="warn"></div>
  </div>
</template>

<script>
const $ = (s, el = document) => el.querySelector(s);
const STALE_MS = 30000;   // online nhưng im lặng quá 30 s -> báo "im lặng"
const SPARK_MS = 15 * 60 * 1000;
const nodes = new Map(), cards = new Map();
let info = {}, log = [], rate = [];

const pretty = (n) => (/^nhom(\d+)$/i.test(n) ? 'Nhóm ' + n.replace(/^nhom/i, '') : n);
const fmt = (v, d = 1) => (v == null ? '--' : (+v).toFixed(d));
function ago(ts) {
  if (!ts) return 'chưa có dữ liệu';
  const s = Math.round((Date.now() - ts) / 1000);
  return s < 60 ? `${s}s trước` : s < 3600 ? `${Math.floor(s / 60)} phút trước` : new Date(ts).toLocaleTimeString('vi-VN');
}
function state(n) {
  if (n.status === 'offline') return ['bad', 'offline'];
  if (!n.seen) return ['', 'chưa kết nối'];
  if (Date.now() - n.seen > STALE_MS) return ['warn', 'im lặng'];
  return ['ok', 'online'];
}

function card(name) {
  if (cards.has(name)) return cards.get(name);
  const el = $('#tpl').content.firstElementChild.cloneNode(true);
  $('h2', el).textContent = pretty(name);
  $('.csv', el).href = `/api/csv/${encodeURIComponent(name)}`;
  const cmd = (v) => fetch(`/api/led/${encodeURIComponent(name)}`, { method: 'POST', body: JSON.stringify({ v }) });
  $('.led', el).onclick = () => cmd(nodes.get(name)?.led ? 0 : 1);
  for (const b of el.querySelectorAll('.ctl button')) b.onclick = () => cmd(+b.dataset.v);
  cards.set(name, el);
  // Giữ thứ tự theo tên để nhóm dễ tìm thẻ của mình
  const after = [...cards.keys()].sort().filter((k) => k > name).map((k) => cards.get(k)).find((c) => c.isConnected);
  $('#grid').insertBefore(el, after || null);
  $('#empty').style.display = 'none';
  return el;
}

function paint(n) {
  const el = card(n.name);
  const [cls, txt] = state(n);
  $('.dot', el).className = 'dot ' + cls;
  $('.st', el).textContent = txt;
  $('.ago', el).textContent = ago(n.seen);
  el.classList.toggle('off', cls === 'bad' || cls === 'warn' || !n.seen);
  $('.t', el).textContent = fmt(n.t);
  const tf = n.t == null ? 0 : Math.max(0, Math.min(1, (n.t - 10) / 35)) * 52;   // thang 10..45 °C
  $('.tfill', el).setAttribute('y', 56 - tf); $('.tfill', el).setAttribute('height', tf);
  $('.h', el).textContent = fmt(n.h, 0);
  const L = 2 * Math.PI * 34;
  $('.hfill', el).setAttribute('stroke-dasharray', `${n.h == null ? 0 : Math.max(0, Math.min(100, n.h)) / 100 * L} ${L}`);
  $('.hfill', el).style.opacity = n.h == null ? 0 : 1;
  $('.led', el).classList.toggle('on', n.led === 1);
  $('.ledv', el).textContent = n.led == null ? '--' : n.led ? 'Đang BẬT' : 'Đang tắt';
  // Phản hồi lệnh điều khiển ngược: kit có báo lại LED đúng trạng thái vừa ra lệnh không
  const fb = $('.fb', el), c = n.cmd;
  fb.className = 'fb' + (c?.state === 'ok' ? ' ok' : c?.state === 'timeout' ? ' bad' : '');
  fb.textContent = !c ? '' : c.state === 'wait' ? `đã gửi "${c.payload}", chờ kit phản hồi…`
    : c.state === 'ok' ? `✓ kit đã ${c.v ? 'bật' : 'tắt'} LED sau ${c.ms} ms`
    : `✗ kit chưa phản hồi "${c.payload}" (đã subscribe ${c.topic.replace(/^vju\/iot\//, '…/')}?)`;
  for (const b of el.querySelectorAll('.ctl button')) b.disabled = state(n)[0] === 'bad' || !n.seen;
  const bb = $('.btnbox', el);
  bb.classList.toggle('on', n.btn === 1);
  $('.btnv', el).textContent = n.btn == null ? '--' : n.btn ? 'Đang nhấn' : 'Thả';
  $('.btnc', el).textContent = `nút · đã nhấn ${n.btnCount} lần`;
  $('.extra', el).textContent = [n.rssi != null ? `RSSI ${n.rssi} dBm` : '', n.ip || '', `${n.msgs} tin`].filter(Boolean).join(' · ');
  spark($('canvas', el), n.hist);
}

// Biểu đồ nhỏ 15 phút gần nhất: mỗi đường tự co giãn theo min/max của nó
function spark(cv, hist) {
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (!w) return;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const now = Date.now(), pts = hist.filter((p) => now - p[0] < SPARK_MS);
  const css = getComputedStyle(document.documentElement);
  g.strokeStyle = css.getPropertyValue('--line'); g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, h - 0.5); g.lineTo(w, h - 0.5); g.stroke();
  if (pts.length < 2) return;
  const span = Math.max(60000, now - pts[0][0]);   // ít dữ liệu thì giãn ra cho đủ khung, tối đa 15 phút
  for (const [i, color] of [[1, '--temp'], [2, '--hum']]) {
    const vals = pts.map((p) => p[i]).filter((v) => v != null);
    if (vals.length < 2) continue;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < 1) { lo -= 0.5; hi += 0.5; }
    g.strokeStyle = css.getPropertyValue(color); g.lineWidth = 1.6; g.beginPath();
    let first = true;
    for (const p of pts) {
      if (p[i] == null) continue;
      const x = w - (now - p[0]) / span * w, y = 4 + (1 - (p[i] - lo) / (hi - lo)) * (h - 8);
      first ? g.moveTo(x, y) : g.lineTo(x, y); first = false;
    }
    g.stroke();
  }
}

// Điểm danh: ô mỗi nhóm + danh sách nhóm chưa lên / đang có vấn đề
function roster() {
  const all = [...nodes.values()].sort((a, b) => a.name.localeCompare(b.name));
  const box = $('#chips');
  const groups = { ok: [], warn: [], bad: [], none: [] };
  for (const n of all) {
    const [cls, txt] = state(n), key = cls || 'none';
    groups[key].push(pretty(n.name));
    let c = box.querySelector(`[data-n="${n.name}"]`);
    if (!c) {
      c = document.createElement('div'); c.dataset.n = n.name;
      c.onclick = () => { const el = cards.get(n.name); if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1500); };
      const after = [...box.children].find((x) => x.dataset.n > n.name);
      box.insertBefore(c, after || null);
    }
    c.className = 'chip ' + key;
    c.innerHTML = `<b>${/^nhom(\d+)$/i.test(n.name) ? n.name.replace(/^nhom/i, '') : n.name}</b><small>${key === 'none' ? 'chưa lên' : txt}</small>`;
    c.title = `${pretty(n.name)}: ${txt}${n.seen ? ' · tin cuối ' + ago(n.seen) : ''}`;
  }
  for (const c of [...box.children]) if (!nodes.has(c.dataset.n)) c.remove();
  $('#rOn').textContent = groups.ok.length;
  $('#rTot').textContent = all.length;
  const short = (arr) => arr.map((x) => x.replace('Nhóm ', '')).join(', ');
  $('#rMiss').innerHTML = [
    groups.none.length ? `Chưa lên: <b>${short(groups.none)}</b>` : '',
    groups.bad.length ? `Rớt mạng: <b>${short(groups.bad)}</b>` : '',
    groups.warn.length ? `Im lặng: <b>${short(groups.warn)}</b>` : '',
  ].filter(Boolean).join(' · ') || (all.length ? '<span style="color:var(--ok)">Tất cả các nhóm đã lên</span>' : '');
}

function summary() {
  roster();
  const all = [...nodes.values()], on = all.filter((n) => state(n)[0] === 'ok');
  $('#sOn').textContent = `${on.length}/${all.length}`;
  const avg = (k) => { const v = on.map((n) => n[k]).filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b) / v.length : null; };
  $('#sT').textContent = avg('t') == null ? '--' : fmt(avg('t')) + ' °C';
  $('#sH').textContent = avg('h') == null ? '--' : fmt(avg('h'), 0) + ' %';
  rate = rate.filter((t) => Date.now() - t < 60000);
  $('#sRate').textContent = rate.length;
}

// Nhật ký
function logLine(e) {
  const d = document.createElement('div');
  d.className = e.warn ? 'w' : e.topic.endsWith('/set') ? 's' : '';
  d.innerHTML = `<time>${new Date(e.ts).toLocaleTimeString('vi-VN')}</time>`;
  d.append(`${e.topic}  ${e.payload}${e.warn ? '   ⚠ ' + e.warn : ''}`);
  d.dataset.k = e.topic.toLowerCase();
  return d;
}
function logVisible(d) {
  const f = $('#filter').value.trim().toLowerCase();
  return (!f || d.dataset.k.includes(f)) && (!$('#onlyWarn').checked || d.className === 'w');
}
function addLog(e) {
  const box = $('#log'), d = logLine(e);
  d.hidden = !logVisible(d);
  box.prepend(d);
  while (box.children.length > 400) box.lastChild.remove();
}
function refilter() { for (const d of $('#log').children) d.hidden = !logVisible(d); }
$('#filter').oninput = refilter; $('#onlyWarn').onchange = refilter;
$('#logToggle').onclick = () => { const o = $('#logbox').classList.toggle('open'); $('#logToggle').textContent = o ? 'Thu gọn' : 'Mở'; };

function setInfo(i) {
  info = i;
  $('#baddr').textContent = i.ip ? `${i.ip} : ${i.port}` : '--';
  $('#bdot').className = 'dot ' + (i.broker ? 'ok' : 'bad');
}

// Hiệu ứng mỗi khi có tin: viền thẻ loé xanh; nhấn nút thì nút loé sóng
function ping(name, prevBtn, n) {
  const el = cards.get(name);
  if (!el) return;
  el.classList.add('ping'); setTimeout(() => el.classList.remove('ping'), 150);
  if (n.btn === 1 && prevBtn !== 1) { const b = $('.btnbox', el); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }
}

const es = new EventSource('/stream');
es.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.kind === 'snapshot') {
    setInfo(m.info);
    for (const n of m.nodes) { nodes.set(n.name, n); paint(n); }
    $('#log').innerHTML = ''; for (const e of m.log) addLog(e);
  } else if (m.kind === 'broker') {
    setInfo({ ...info, broker: m.ok });
  } else if (m.kind === 'node') {
    const prev = nodes.get(m.node.name)?.btn;
    nodes.set(m.node.name, m.node); paint(m.node); ping(m.node.name, prev, m.node);
    addLog(m.entry); rate.push(Date.now());
    if (m.entry.warn) $('.warn', cards.get(m.node.name)).textContent = '⚠ ' + m.entry.warn;
    else $('.warn', cards.get(m.node.name)).textContent = '';
  } else if (m.kind === 'log') {
    addLog(m.entry);
  } else if (m.kind === 'forget') {
    nodes.delete(m.name); cards.get(m.name)?.remove(); cards.delete(m.name);
  }
  summary();
};
es.onerror = () => { $('#bdot').className = 'dot bad'; };

// Cập nhật "x giây trước", trạng thái im lặng và biểu đồ trôi theo thời gian
setInterval(() => { for (const n of nodes.values()) paint(n); summary(); }, 2000);
addEventListener('resize', () => { for (const n of nodes.values()) paint(n); });
</script>
</body>
