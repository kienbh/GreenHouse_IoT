# Mosquitto broker cho nhà kính (chạy bằng ./start.sh, đường dẫn tính từ thư mục này)
# Cổng 1883: ESP32 và app kết nối bằng MQTT/TCP trong mạng LAN
listener 1883 0.0.0.0
# Cổng 9001: WebSocket, để trình duyệt (MQTT Explorer web, mqtt.js) nối thẳng nếu cần
listener 9001 0.0.0.0
protocol websockets

# Bắt buộc đăng nhập, tài khoản tạo bằng ./setup.sh
allow_anonymous false
password_file passwd

# Giữ lại tin retained (trạng thái online/offline) khi khởi động lại broker
persistence true
persistence_location data/

log_dest stdout
log_dest file log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %H:%M:%S
