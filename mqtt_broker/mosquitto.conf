# Mosquitto broker cho nhà kính (chạy bằng ./start.sh, đường dẫn tính từ thư mục này)
# Bài 8: mỗi cổng có cấu hình xác thực riêng
per_listener_settings true

# Cổng 8883: MQTT qua TLS cho nhà kính (ESP32, app, giả lập). Bắt buộc tài khoản + mật khẩu.
# Chứng chỉ tạo bằng tls/make-certs.sh (CA riêng, chứng chỉ server ghi IP của PC).
listener 8883 0.0.0.0
cafile tls/ca.crt
certfile tls/server.crt
keyfile tls/server.key
tls_version tlsv1.2
listener_allow_anonymous false
password_file passwd
acl_file acl

# Cổng 1883: KHÔNG mã hóa, chỉ giữ cho bài tập nhóm (lab_nhom) – ESP32 SV không cần tài khoản.
# Không có password_file nên tài khoản nhà kính không đăng nhập được ở đây (mật khẩu không bao giờ đi
# qua đường không mã hóa); ACL chỉ cho client vô danh dùng nhánh vju/iot/#.
listener 1883 0.0.0.0
listener_allow_anonymous true
acl_file acl_lab

# Đã bỏ cổng WebSocket 9001 (không dùng tới, không mã hóa).

# Giữ lại tin retained (trạng thái online/offline) khi khởi động lại broker
persistence true
persistence_location data/

log_dest stdout
log_dest file log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %H:%M:%S
